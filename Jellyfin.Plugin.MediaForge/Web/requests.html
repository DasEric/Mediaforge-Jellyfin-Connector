<div id="MediaForgeRequestsPage" data-role="page" class="page type-interior" data-require="emby-button,emby-input,emby-select,emby-checkbox" data-controller="__plugin/MediaForgeRequestsJS">
  <style>
    .mf-app{max-width:1180px;margin:0 auto;padding:1.2rem;color:var(--primary-text-color,#eee)}
    .mf-head{display:flex;gap:1rem;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:1rem}
    .mf-title{margin:0;font-size:1.65rem}.mf-muted{opacity:.68}.mf-status{padding:.35rem .65rem;border-radius:999px;background:rgba(0,164,220,.16);font-size:.85rem}
    .mf-tabs{display:flex;gap:.45rem;flex-wrap:wrap;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:1rem;padding-bottom:.65rem}
    .mf-tab{border:0;border-radius:.4rem;padding:.65rem .9rem;background:rgba(255,255,255,.08);color:inherit;cursor:pointer}.mf-tab.active{background:#00a4dc;color:#fff}
    .mf-panel{display:none}.mf-panel.active{display:block}.mf-searchbar{display:grid;grid-template-columns:minmax(12rem,1fr) minmax(10rem,.35fr) auto;gap:.65rem;align-items:end}
    .mf-field label{display:block;font-size:.85rem;margin:0 0 .3rem;opacity:.75}.mf-input,.mf-select{width:100%;box-sizing:border-box;border:1px solid rgba(255,255,255,.2);border-radius:.4rem;background:rgba(0,0,0,.22);color:inherit;padding:.72rem}
    .mf-btn{border:0;border-radius:.4rem;padding:.72rem 1rem;background:#00a4dc;color:#fff;cursor:pointer;font-weight:600}.mf-btn.secondary{background:rgba(255,255,255,.11);color:inherit}.mf-btn.danger{background:#9f2d38}.mf-btn:disabled{opacity:.5;cursor:default}
    .mf-results{display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:.8rem;margin-top:1rem}.mf-card{border:1px solid rgba(255,255,255,.12);border-radius:.55rem;background:rgba(255,255,255,.055);overflow:hidden;cursor:pointer;min-height:115px;display:flex;flex-direction:column}.mf-card:hover{border-color:#00a4dc;transform:translateY(-1px)}
    .mf-cover{aspect-ratio:2/3;object-fit:cover;width:100%;background:linear-gradient(135deg,#152f42,#281b3e)}.mf-cardbody{padding:.75rem}.mf-cardtitle{font-weight:650;line-height:1.25}.mf-source{font-size:.78rem;opacity:.65;margin-top:.35rem}
    .mf-discover{margin-top:1.25rem}.mf-discoverrow{margin:0 0 1.5rem}.mf-discoverhead{font-size:1.2rem;margin:0 0 .65rem}.mf-discovergrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:.8rem}
    [hidden]{display:none!important}.mf-notice{padding:.75rem;border-radius:.45rem;background:rgba(0,164,220,.12);margin:.75rem 0}.mf-error{background:rgba(190,45,55,.17);color:#ffb5bb}.mf-empty{padding:2rem;text-align:center;opacity:.65}
    .mf-list{display:grid;gap:.65rem}.mf-request{border:1px solid rgba(255,255,255,.12);border-radius:.5rem;padding:.85rem;background:rgba(255,255,255,.045)}.mf-requesttop{display:flex;justify-content:space-between;gap:.7rem;align-items:flex-start}.mf-requesttitle{font-weight:650}.mf-meta{font-size:.82rem;opacity:.68;margin-top:.35rem}.mf-actions{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.65rem}
    .mf-pill{font-size:.75rem;padding:.24rem .5rem;border-radius:999px;background:rgba(255,255,255,.1)}.mf-pill.pending{background:rgba(247,183,49,.2)}.mf-pill.queued,.mf-pill.completed,.mf-pill.available{background:rgba(45,180,90,.2)}.mf-pill.failed,.mf-pill.partial,.mf-pill.cancelled,.mf-pill.rejected{background:rgba(190,45,55,.2)}
    .mf-requestprogress{margin-top:.7rem}.mf-requestprogresstrack{height:.45rem;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.12)}.mf-requestprogressfill{height:100%;background:#00a4dc;transition:width .3s ease}.mf-pill.withdrawn{background:rgba(130,130,130,.2)}
    .mf-overlay{display:none;position:fixed;inset:0;z-index:1200;background:rgba(0,0,0,.78);align-items:center;justify-content:center;padding:1rem}.mf-dialog{width:min(900px,100%);max-height:92vh;overflow:auto;border-radius:.65rem;background:#181818;border:1px solid rgba(255,255,255,.15);box-shadow:0 1rem 3rem rgba(0,0,0,.5)}
    .mf-dialoghead{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;padding:.9rem 1rem;background:#181818;border-bottom:1px solid rgba(255,255,255,.1)}.mf-dialogbody{padding:1rem}.mf-close{border:0;background:transparent;color:inherit;font-size:1.6rem;cursor:pointer}
    .mf-detailgrid{display:grid;grid-template-columns:1fr;gap:.7rem}.mf-description{opacity:.76;line-height:1.45}.mf-plan{margin:1rem 0;padding:.85rem;border:1px solid rgba(0,164,220,.45);border-radius:.45rem;background:rgba(0,164,220,.1)}.mf-plan.complete{border-color:rgba(45,180,90,.5);background:rgba(45,180,90,.1)}.mf-episode{display:flex;gap:.45rem;align-items:flex-start;padding:.38rem;border-radius:.3rem;background:rgba(255,255,255,.045);font-size:.86rem}
    .mf-options{display:grid;grid-template-columns:1fr 1fr;gap:.65rem;margin:1rem 0}.mf-dialogactions{position:sticky;bottom:0;background:#181818;border-top:1px solid rgba(255,255,255,.1);padding:.8rem 0 0;display:flex;justify-content:flex-end;gap:.5rem}
    @media(max-width:650px){.mf-searchbar{grid-template-columns:1fr}.mf-options{grid-template-columns:1fr}.mf-app{padding:.75rem}.mf-results{grid-template-columns:repeat(2,minmax(0,1fr))}}
  </style>
  <div data-role="content"><div class="content-primary mf-app">
    <div class="mf-head"><div><h2 class="mf-title">MediaForge Anfragen</h2><div class="mf-muted">Filme und Serien suchen und für Jellyfin anfragen</div></div><span class="mf-status" data-mf="mode">Laden…</span></div>
    <div data-mf="notice"></div>
    <nav class="mf-tabs">
      <button class="mf-tab active" data-tab="search" type="button">Suche</button>
      <button class="mf-tab" data-tab="mine" type="button">Meine Anfragen</button>
      <button class="mf-tab" data-tab="admin" type="button" style="display:none">Admin</button>
    </nav>
    <section class="mf-panel active" data-panel="search">
      <form class="mf-searchbar" data-mf="search-form">
        <div class="mf-field"><label>Film oder Serie</label><input class="mf-input" data-mf="query" minlength="2" maxlength="120" required placeholder="z. B. Dune oder Breaking Bad"></div>
        <div class="mf-field"><label>Quelle</label><select class="mf-select" data-mf="source"><option value="all">Alle Quellen</option></select></div>
        <button class="mf-btn" type="submit">Suchen</button>
      </form>
      <div class="mf-discover" data-mf="discover"><div class="mf-empty">Filme und Serien werden geladen…</div></div>
      <div class="mf-results" data-mf="results" hidden></div>
    </section>
    <section class="mf-panel" data-panel="mine"><div class="mf-actions"><button class="mf-btn secondary" data-mf="refresh-mine" type="button">Aktualisieren</button></div><div class="mf-list" data-mf="mine"></div></section>
    <section class="mf-panel" data-panel="admin"><div class="mf-actions"><button class="mf-btn secondary" data-mf="refresh-admin" type="button">Aktualisieren</button></div><div class="mf-list" data-mf="admin"></div></section>

    <div class="mf-overlay" data-mf="overlay" role="dialog" aria-modal="true">
      <div class="mf-dialog">
        <div class="mf-dialoghead"><strong data-mf="detail-title">Titel</strong><button class="mf-close" data-mf="close" type="button" aria-label="Schließen">×</button></div>
        <div class="mf-dialogbody">
          <div class="mf-description" data-mf="description"></div>
          <div data-mf="plan"></div>
          <div class="mf-options">
            <div class="mf-field"><label>Sprache</label><select class="mf-select" data-mf="language"></select></div>
            <div class="mf-field"><label>Provider/Hoster</label><select class="mf-select" data-mf="provider"></select></div>
          </div>
          <label class="mf-episode"><input type="checkbox" data-mf="upscale"> Anime4K-Upscaling verwenden (falls in MediaForge eingerichtet)</label>
          <div class="mf-dialogactions"><button class="mf-btn secondary" data-mf="cancel" type="button">Abbrechen</button><button class="mf-btn" data-mf="request" type="button">Anfragen</button></div>
        </div>
      </div>
    </div>
  </div></div>
</div>
