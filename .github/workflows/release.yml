name: Build, release and publish Jellyfin repository

on:
  push:
    tags:
      - "v*"

concurrency:
  group: jellyfin-release
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out tagged source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install .NET SDK
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 9.0.317

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13.7"
          cache: pip
          cache-dependency-path: Tests/requirements-ci.txt

      - name: Validate release metadata
        shell: pwsh
        run: ./scripts/validate-release.ps1 -Tag $env:GITHUB_REF_NAME

      - name: Restore locked .NET dependencies
        run: dotnet restore Tests/Connector.SecurityTests/Connector.SecurityTests.csproj --locked-mode

      - name: Audit .NET dependencies
        run: dotnet list Jellyfin.Plugin.MediaForge/Jellyfin.Plugin.MediaForge.csproj package --vulnerable --include-transitive

      - name: Build with warnings as errors
        run: dotnet build Jellyfin.Plugin.MediaForge/Jellyfin.Plugin.MediaForge.csproj --configuration Release --no-restore -warnaserror

      - name: Run .NET security tests
        run: dotnet run --project Tests/Connector.SecurityTests/Connector.SecurityTests.csproj --configuration Release --no-restore

      - name: Install hash-locked Python test dependencies
        run: python -m pip install --require-hashes -r Tests/requirements-ci.txt

      - name: Run MediaForge module tests and lint
        run: |
          python -m unittest discover -s Tests -p "test_*.py"
          ruff check MediaForge.Module Tests/test_mediaforge_module.py

      - name: Check browser scripts
        run: |
          node --check Jellyfin.Plugin.MediaForge/Web/injection.js
          node --check Jellyfin.Plugin.MediaForge/Web/requests.js
          node --check Jellyfin.Plugin.MediaForge/Web/config.js

      - name: Build release archives
        shell: pwsh
        run: ./scripts/build.ps1 -NoRestore

      - name: Generate Jellyfin repository manifest
        shell: pwsh
        run: ./scripts/generate-manifest.ps1 -RepositorySlug $env:GITHUB_REPOSITORY -ReleaseTag $env:GITHUB_REF_NAME

      - name: Upload release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bundle
          if-no-files-found: error
          retention-days: 7
          path: |
            dist/Jellyfin.Plugin.MediaForge.dll
            dist/MediaForgeRequests_*.zip
            dist/mediaforge_jellyfin_connector_*.zip
            dist/SHA256SUMS.txt

      - name: Upload Jellyfin repository site
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: repository

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: release-bundle
          path: dist

      - name: Verify SHA-256 checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/Jellyfin.Plugin.MediaForge.dll
          dist/MediaForgeRequests_*.zip
          dist/mediaforge_jellyfin_connector_*.zip
          dist/SHA256SUMS.txt
          --verify-tag
          --title "MediaForge Requests $GITHUB_REF_NAME"
          --generate-notes

  deploy-repository:
    needs: [build, release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Publish manifest.json
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
